    <div id="wrapper">
        <header>
            <a id="logo" href="index.html"><span class="pink">Number</span> <i>up</i></a>
             <nav id="mainnav">
            <ul>
                <li class="active"><a href="uslugi.html">услуги</a></li>

            </ul>
        </nav>
        </header>
        <main>
            <form id="contact-form" action="">
                <div class="form_item">
                    <label for="topic">Тема</label><br>
                    <select name="topic" id="topic" required >
                        <option value="" disabled selected hidden>Выберите тему...</option>
                        <option value="1">Заказать услугу</option>
                        <option value="2">Оставить отзыв/замечание</option>
                        <option value="3">Предложить сотрудничество</option>
                        <option value="4">Другое</option>
                    </select>
                </div>
                <div class="form_item">
                    <label for="name">Имя</label><br>
                 <input name="name" id="name" type="text" placeholder="Введите имя" required>
                </div>
                <div class="form">
                    <label for="phone">Номер телефона</label><br>
                    <input type="tel" name="phone" id="phone" placeholder="+7 (999) 123-45-67"
                    title="Введите корректный номер телефона в формате +7 (999) 123-45-67 или 89991234567"
                    required>
                </div>
                <div class="form_item">
                    <label for="E-mail">E-mail</label><br>
                    <input type="email" name="E-mail" id="E-mail" placeholder="example@mail.com"
                    title="Введите корректный адрес электронной почты" required>
                </div>
                <div class="form_item">
                    <label for="textarea">текст</label><br>
                    <textarea  id="textarea" rows="5" minlength="15" required></textarea>
                </div>
                <div class="form_item">
                    <input type="submit">
                </div>
            </form>
        </main>
    </div>
